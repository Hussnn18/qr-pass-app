# Integration tests: in-memory H2 in MySQL mode, no demo data, fixed test secrets.
spring:
  datasource:
    url: jdbc:h2:mem:scems-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 60
app:
  jwt:
    secret: test-only-jwt-secret-0123456789abcdef0123456789
  pass-key: dGVzdC1vbmx5LXBhc3Mta2V5LTMyLWJ5dGVzLW9rISE=
  upload-dir: target/test-uploads
  seed:
    enabled: false
  scheduling:
    enabled: false
logging:
  level:
    root: WARN
