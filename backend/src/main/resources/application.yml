# Smart Campus Events — backend configuration.
# Profiles to run with:
#   dev  (default) MySQL on localhost, demo data seeded on first start
#   supabase       Supabase (hosted PostgreSQL), demo data seeded on first start
#   h2             in-memory database, demo data seeded — runs without MySQL
#   prod           production: every secret from the environment, no demo data.
#                  Use "prod,postgres" for Supabase (see DEPLOY.md), plain "prod" for MySQL.
#
# Settings such as DB_URL / DB_PASSWORD can be environment variables or lines in backend/.env
# (git-ignored; see .env.example).
spring:
  application:
    name: smart-campus-events
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
    group:
      dev: local
      supabase: [postgres, local]
      h2: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # Flyway owns the schema (src/main/resources/db/migration)
    properties:
      hibernate:
        jdbc.time_zone: UTC
        type.preferred_instant_jdbc_type: TIMESTAMP
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    # {vendor} becomes mysql or postgresql, matching the connected database.
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: ${PORT:8080}

app:
  # Comma-separated origins allowed to call the API. On Render the site is served from the same URL,
  # which Render provides as RENDER_EXTERNAL_URL; set FRONTEND_ORIGIN only for a custom domain.
  frontend-origin: ${FRONTEND_ORIGIN:${RENDER_EXTERNAL_URL:http://localhost:5173}}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 7d
  pass-key: ${PASS_KEY:}
  cookie-secure: ${COOKIE_SECURE:false}
  seed:
    enabled: false
  # Creates this administrator on start-up when no administrator exists yet (production's first sign-in).
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Portal Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
# Shared by dev, supabase and h2: local-only secrets and demo data. Never use these values in production.
spring:
  config:
    activate:
      on-profile: local
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
  pass-key: ${PASS_KEY:ZGV2LW9ubHktcGFzcy1rZXktMzItYnl0ZXMtbG9uZyE=}
  seed:
    enabled: ${SEED_DEMO_DATA:true}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_campus_events?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:scems_app}
    password: ${DB_PASSWORD:scems_local_dev}

---
# PostgreSQL / Supabase layout, used by "supabase" (development) and "prod,postgres" (production).
# Connect through Supabase's "Session pooler" (IPv4, keeps session settings). Tables live in their own
# schema, not "public", so Supabase's auto-generated REST API does not expose them.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      schema: ${DB_SCHEMA:scems}
      maximum-pool-size: ${DB_POOL_SIZE:5}   # the free tier allows only a few pooled connections
      # Keep trying the first connection for up to 2 minutes instead of failing at once. On a 0.1-CPU
      # instance the JVM's very first TLS handshake can be too slow for Supabase; later ones are fast.
      initialization-fail-timeout: 120000
  flyway:
    default-schema: ${DB_SCHEMA:scems}
    schemas: ${DB_SCHEMA:scems}

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:scems;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/mysql

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
server:
  # Render ends HTTPS at its proxy; trust its X-Forwarded-* headers so requests count as https.
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
  tomcat:
    threads:
      max: 50   # small instances; requests beyond the DB pool only queue anyway
app:
  cookie-secure: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
