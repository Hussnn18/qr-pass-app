<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Pass - Student Portal</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="college-theme">
    <!-- College Header (Image Banner) -->
    <header class="college-header-banner" style="text-align: center; background: white; border-bottom: 3px solid #b91c1c; padding: 10px 0;">
        <!-- Replace 'header-logo.png' with the actual filename you placed in the public folder -->
        <img src="header-logo.png" alt="Guru Nanak Dev Engineering College Header" style="max-width: 100%; height: auto; display: inline-block;">
    </header>

    <!-- Main Content Container -->
    <div class="college-main-content">
        <!-- Login Screen -->
        <div id="loginScreen" class="college-card login-card">
        <h1>Student Login</h1>
        <p>Access your event QR passes</p>
        <div id="loginAlert" class="alert hidden"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="urn">College URN</label>
                <input type="text" id="urn" placeholder="e.g. URN101" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password (pass123 for demo)" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">Login</button>
        </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboardScreen" class="college-main-content hidden">
        <div class="college-card dashboard-header-card">
        <div class="nav">
            <span>Welcome, <strong id="studentName">Student</strong></span>
            <div>
                <button id="uploadPhotoBtn" class="btn-secondary" style="margin-right: 0.5rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">Upload Photo</button>
                <button id="changePassBtn" style="margin-right: 1rem;">Change Password</button>
                <button id="logoutBtn">Logout</button>
            </div>
        </div>

        <!-- Change Password Modal -->
        <div id="passwordModal" class="glass-container hidden" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <h3>Change Password</h3>
            <div id="passwordAlert" class="alert hidden"></div>
            <div class="form-group" style="margin-top:1rem;">
                <label>Current Password</label>
                <input type="password" id="currentPassword" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" required>
            </div>
            <div style="display:flex; gap:1rem; margin-top:1.5rem;">
                <button id="closePasswordModal" class="btn-secondary" style="flex:1; padding:0.8rem; margin:0; border-radius:8px;">Cancel</button>
                <button id="submitPasswordBtn" class="btn" style="flex:1; padding:0.8rem; margin:0;">Update</button>
            </div>
        </div>

        <!-- Upload Photo Modal -->
        <div id="photoModal" class="glass-container hidden" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <h3>Upload Profile Photo</h3>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem;">This photo will be displayed on your QR Passes.</p>
            <div id="photoAlert" class="alert hidden"></div>
            <div class="form-group" style="margin-top:1rem;">
                <input type="file" id="studentPhotoInput" accept="image/*" required style="padding: 0.5rem 0;">
            </div>
            <div style="display:flex; gap:1rem; margin-top:1.5rem;">
                <button id="closePhotoModal" class="btn-secondary" style="flex:1; padding:0.8rem; margin:0; border-radius:8px;">Cancel</button>
                <button id="submitPhotoBtn" class="btn" style="flex:1; padding:0.8rem; margin:0;">Upload</button>
            </div>
        </div>

        <!-- Overlay -->
        <div id="passwordOverlay" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 999;"></div>

        <!-- Active Events Section -->
        <div id="activeEventsSection">
            <h2>🎯 Active Events</h2>
            <p>Events you can register for</p>
            <div id="activeEventsContainer" class="events-student-list">
                <p>Loading events...</p>
            </div>
        </div>

        <div class="section-divider"></div>

        <!-- Confirmed Passes Section -->
        <h2>🎟️ Your Confirmed Passes</h2>
        <p>Show these QR passes at the entrance.</p>
        <div id="passesContainer" class="pass-list">
            <p>Loading passes...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
